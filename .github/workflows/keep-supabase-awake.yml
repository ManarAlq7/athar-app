name: Keep Supabase awake

# Supabase pauses free projects after a week without activity.
# This job reads one row twice a week so the Athar database stays up.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one photo row through the public API
        run: |
          export $(grep -E '^VITE_SUPABASE_(URL|ANON_KEY)=' .env.production | tr -d '\r' | xargs)
          curl -fsS "$VITE_SUPABASE_URL/rest/v1/photos?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY"
